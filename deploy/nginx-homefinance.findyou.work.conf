# Host nginx reverse proxy for homefinance.findyou.work
#
# Install on the Contabo server (same pattern as calls.findyou.work):
#   sudo cp deploy/nginx-homefinance.findyou.work.conf \
#           /etc/nginx/sites-available/homefinance.findyou.work.conf
#   sudo ln -s /etc/nginx/sites-available/homefinance.findyou.work.conf \
#              /etc/nginx/sites-enabled/homefinance.findyou.work.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let Certbot add the HTTPS (443) server block automatically:
#   sudo certbot --nginx -d homefinance.findyou.work
#
# This is HTTP-first on purpose — Certbot rewrites it to redirect 80 -> 443.
server {
    listen 80;
    listen [::]:80;
    server_name homefinance.findyou.work;

    # Receipt images and CSV imports can be a few MB — give some headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR upgrade support (harmless in prod, needed if ever used).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
